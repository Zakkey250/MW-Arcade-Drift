[Drift]
Enabled=1
ObserveOnly=0
Telemetry=0
; Ctrl+D toggles assistance in driving. No handling values are modified.
; First take a normal gentle turn to calibrate steering polarity.
; Brake while steering to start; holding the brake is supported.
; Center the steering to cancel. No automatic re-entry without braking.

[Presentation]
Enabled=1
; Player-only render wheel and caller-scoped RPM overrides. No gearbox writes.

[Camera]
Enabled=1
; Smooth drift chase camera. Set 0 and restart to disable.

[Input]
AutoIndependentTriggers=1
LegacyIndependentTriggers=0
; Default uses game-mapped actions for all four driving controls.
; Set 1 ONLY for legacy RT=gas / LT=brake simultaneous-trigger compatibility.
