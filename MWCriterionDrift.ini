[Diagnostics]
Logging=0

[Drift]
Enabled=1
InitialMode=1
; 0=Normal (no assistance), 1=Arcade (released handling), 2=Special.
; Ctrl+D cycles Normal -> Arcade -> Special -> Normal.
ObserveOnly=0
Telemetry=0
; EN: Ctrl+D cycles modes. Special uses temporary native tyre/aero parameters; saved car data is unchanged.
; JA: Ctrl+Dでモードを切替。Specialは純正タイヤ・空気抵抗を一時調整し、保存車両データは変更しません。
; First take a normal gentle turn to calibrate steering polarity.
; Arcade: brake while steering to start; holding the brake is supported.
; Arcade: center steering to cancel. Re-entry requires braking.
; Special: steering with throttle, handbrake or existing slip starts a drift.

[Presentation]
Enabled=1
; Arcade-only wheel/RPM presentation. Special keeps native wheel speed and RPM. No gearbox writes.

[Camera]
Enabled=1
; Smooth drift chase camera. Set 0 and restart to disable.

[Input]
ControlDevice=PadKeyboard
; EN: PadKeyboard = gamepad/keyboard drift input assistance; Wheel = direct wheel inputs.
; JA: PadKeyboard = パッド／キーボード向け入力補正、Wheel = ハンコン向け直接入力。
; EN: Arcade smooths steering/throttle assistance. Special assists native steering only; pedals are unchanged.
; JA: Arcadeは操舵・アクセル補助を平滑化。Specialは純正操舵だけを補助し、ペダル入力は維持。
; EN: Preserves game control bindings. Restart the game after changing this option.
; JA: ゲーム側のキー・軸割り当てを使用。変更後はゲームを再起動してください。
AutoIndependentTriggers=1
LegacyIndependentTriggers=0
; Default uses game-mapped actions for all four driving controls.
; Set 1 ONLY for legacy RT=gas / LT=brake simultaneous-trigger compatibility.
